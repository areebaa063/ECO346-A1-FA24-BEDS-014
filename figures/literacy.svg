<text x='5.98' y='14.57' style='font-size: 12.00px; font-weight: bold; font-family: "Arial";' textLength='675.28px' lengthAdjust='spacingAndGlyphs'>In rural Balochistan the literacy gap between men and women is widest at ages 40-44: 55.4% of men vs 7.5% of women</text>
